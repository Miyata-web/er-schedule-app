name = "er-schedule-cron"
main = "index.ts"
compatibility_date = "2024-09-23"

[triggers]
crons = [
  "30 23 * * *",
  "0 6 * * *",
  "0 11 * * *"
]

# 環境変数は wrangler secret で設定:
#   wrangler secret put APP_URL     例: https://er-schedule-app.pages.dev
#   wrangler secret put CRON_SECRET  メインアプリの CRON_SECRET と同じ値
